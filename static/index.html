<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四国象棋</title>
<link rel="stylesheet" href="/static/style.css?v=7">
</head>
<body>
<div id="app">
  <!-- 登录页 -->
  <div id="page-login" class="page">
    <div class="login-box">
      <h1>🏯 四国象棋</h1>
      <p class="subtitle">局域网对战</p>
      <input id="login-name" type="text" placeholder="用户名" maxlength="12" autofocus>
      <input id="login-password" type="password" placeholder="密码（新用户自动注册）" maxlength="20">
      <button id="btn-login" onclick="doLogin()">进入大厅</button>
      <p id="login-error" class="error"></p>
    </div>
  </div>

  <!-- 大厅 -->
  <div id="page-lobby" class="page" style="display:none">
    <div class="lobby-header">
      <h2>🏯 游戏大厅</h2>
      <span id="lobby-user" class="user-tag"></span>
      <a href="#" onclick="doLogout()" style="color:#b8956a;font-size:12px;margin-left:8px;text-decoration:none">退出</a>
    </div>
    <div class="lobby-controls">
      <select id="room-mode">
        <option value="ffa">自由对战</option>
        <option value="team">组队对战</option>
        <option value="team_stratagem">组队对战（锦囊）</option>
      </select>
      <button onclick="createRoom()">创建房间</button>
    </div>
    <div id="room-list" class="room-list">
      <div class="empty-msg">暂无房间，创建一个吧</div>
    </div>
  </div>

  <!-- 房间等待 -->
  <div id="room-waiting" class="page" style="display:none; width:100%">
      <div class="room-waiting-header">
        <h2>🏯 房间 <span id="room-id-display"></span></h2>
        <span id="room-mode-display" class="room-mode-tag"></span>
        <button class="btn-sm" onclick="leaveRoom()" style="margin-left:auto">离开房间</button>
      </div>
      <div class="room-seats">
        <div class="seat" id="seat-0">
          <div class="seat-color" style="background:#CC3333"></div>
          <div class="seat-name" id="seat-name-0">等待加入...</div>
          <div class="seat-ready" id="seat-ready-0"></div>
          <div class="seat-actions" id="seat-actions-0"></div>
        </div>
        <div class="seat" id="seat-1">
          <div class="seat-color" style="background:#2E7D32"></div>
          <div class="seat-name" id="seat-name-1">等待加入...</div>
          <div class="seat-ready" id="seat-ready-1"></div>
          <div class="seat-actions" id="seat-actions-1"></div>
        </div>
        <div class="seat" id="seat-2">
          <div class="seat-color" style="background:#B8860B"></div>
          <div class="seat-name" id="seat-name-2">等待加入...</div>
          <div class="seat-ready" id="seat-ready-2"></div>
          <div class="seat-actions" id="seat-actions-2"></div>
        </div>
        <div class="seat" id="seat-3">
          <div class="seat-color" style="background:#1565C0"></div>
          <div class="seat-name" id="seat-name-3">等待加入...</div>
          <div class="seat-ready" id="seat-ready-3"></div>
          <div class="seat-actions" id="seat-actions-3"></div>
        </div>
      </div>
      <div class="room-start-area">
        <button class="btn-start-game" id="btn-start-game" onclick="requestStartGame()" style="display:none">开始游戏</button>
      </div>
      <div id="ally-panel" class="ally-panel" style="display:none">
        <div class="ally-title">🤝 选择盟友</div>
        <div class="ally-hint">邀请相邻玩家成为队友（结盟需要对方同意）</div>
        <div id="ally-player-list"></div>
        <div id="ally-notification" class="ally-notification" style="display:none"></div>
      </div>
    </div>

  <!-- 游戏 -->
  <div id="page-game" class="page" style="display:none">
    <div class="game-header">
      <div class="header-left">
        <h3>四国象棋</h3>
        <span id="game-info" class="game-info"></span>
      </div>
      <div class="header-right">
        <span id="turn-timer" class="turn-timer"></span>
        <span id="current-turn-display" class="current-turn-text">等待开始...</span>
        <button class="btn-sm" onclick="requestUndo()" id="btn-undo" style="display:none">悔棋</button>
        <button class="btn-sm" onclick="toggleBGM()" id="btn-bgm">🎵 音乐</button>
        <button class="btn-sm btn-end-game" onclick="endGame()" id="btn-end-game" style="display:none">结束游戏</button>
        <button class="btn-sm" onclick="leaveGame()">退出</button>
      </div>
    </div>
    <div class="game-area">
      <div class="board-wrap">
        <canvas id="board-canvas"></canvas>
        <div id="player-card-bl" class="player-card card-bl"></div>
        <div id="player-card-tl" class="player-card card-tl"></div>
        <div id="player-card-tr" class="player-card card-tr"></div>
        <div id="player-card-br" class="player-card card-br"></div>
      </div>
    </div>
    <div id="status-bar" class="status-bar">等待游戏开始...</div>
    <div id="undo-overlay" class="modal-overlay" style="display:none">
      <div class="modal-box">
        <div class="modal-invite-text">🔄 悔棋请求</div>
        <div class="modal-hint" id="undo-vote-hint">玩家请求悔棋</div>
        <div class="modal-buttons">
          <button class="ally-btn ally-btn-accept" onclick="sendUndoVote('yes')" style="padding:10px 32px;font-size:16px;border-radius:8px">同意</button>
          <button class="ally-btn ally-btn-decline" onclick="sendUndoVote('no')" style="padding:10px 32px;font-size:16px;border-radius:8px">拒绝</button>
        </div>
      </div>
    </div>
    <!-- 轮到走子棋盘弹窗 -->
    <div id="turn-board-popup" class="board-popup-tr" style="display:none">
      <div id="turn-popup-text" style="font-size:14px;font-weight:bold;color:#e8d5b7;line-height:1.5"></div>
      <div id="turn-popup-hint" style="font-size:16px;color:#d4aa7c;margin-top:2px"></div>
    </div>
  </div>
</div>

  <!-- 锦囊选择弹窗 -->
  <div id="stratagem-overlay" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <div class="modal-invite-text" style="font-size:22px">🏯 锦囊选择</div>
      <div class="modal-hint" style="margin-bottom:16px">选择一种锦囊，盟友将自动获得另一个</div>
      <div id="stratagem-options" style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap">
        <div class="stratagem-card" onclick="selectStratagem('resurrect')">
          <div class="stratagem-name">借尸还魂</div>
          <div class="stratagem-desc">在自己回合使用，在随机空位复活一个车</div>
        </div>
        <div class="stratagem-card" onclick="selectStratagem('retreat')">
          <div class="stratagem-name">鸣金收兵</div>
          <div class="stratagem-desc">在自己回合使用，将所有已移动的棋子召回初始位置</div>
        </div>
      </div>
      <div id="stratagem-status" style="margin-top:12px;color:#b8956a;font-size:13px"></div>
    </div>
  </div>
  <!-- 锦囊已使用通知 -->
  <div id="stratagem-notify" class="board-popup-tr" style="display:none;pointer-events:none"></div>

<script src="/static/script.js?v=30"></script>
</body>
</html>
